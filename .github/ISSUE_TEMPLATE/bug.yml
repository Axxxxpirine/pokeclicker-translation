name: Translation error or bug
description: Report incorrect or missing text, or a problem with the translation.
title: "[Beta] "
body:
  - type: markdown
    attributes:
      value: "Thank you for your feedback. Do not attach your full save or personal information."
  - type: input
    id: versions
    attributes:
      label: Versions and browser
      description: Versions of the userscript, PokéClicker, your browser and Tampermonkey.
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Screen, location and steps to reproduce
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact text and a cropped screenshot if useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result or proposed correction
      description: For an official name, add a reference if possible.
  - type: dropdown
    id: disabled
    attributes:
      label: Does the issue persist with the FR button disabled?
      options:
        - Not tested yet
        - "Yes"
        - "No"
  - type: textarea
    id: scripts
    attributes:
      label: Other active scripts
      description: List any scripts that may change this screen.
